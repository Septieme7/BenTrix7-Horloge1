<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horloge BenTrix7</title>
    <!-- Fichier CSS externe -->
    <link rel="stylesheet" href="./horloge_1.css">
</head>
<body>
    <!-- Canvas pour l'effet Matrix -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Compte à rebours -->
    <div class="countdown-container">
        <div class="countdown-title">The End of FORMATION...</div>
        <div id="countdown" class="countdown"></div>
    </div>

    <div class="content">
        <!-- Horloge -->
        <div class="clock-container">
            <div id="clock" class="digital-clock"></div>
        </div>

        <!-- Zone logo + images cachées -->
        <div class="logo-container">
            <!-- Pilule Matrix BLEUE à gauche -->
            <div class="pill-container blue-pill" onmouseover="playSound('blue')" onmouseout="stopSound('blue')">
                <div class="matrix-pill">
                    <div class="pill-divider"></div>
                </div>
                <div class="matrix-code">01000010 01101100 01110101 01100101</div>
            </div>
            
            <!-- Logo central -->
            <img src="./assets/images/logo.png" alt="Logo" class="logo">
            
            <!-- Pilule Matrix ROUGE à droite -->
            <div class="pill-container red-pill" onmouseover="playSound('red')" onmouseout="stopSound('red')">
                <div class="matrix-pill">
                    <div class="pill-divider"></div>
                </div>
                <div class="matrix-code">01010010 01100101 01100100</div>
            </div>
        </div>

        <!-- Lapin -->
        <div class="rabbit-container">
            <svg class="rabbit" viewBox="0 0 150 80" width="150" height="80">
                <!-- Oreille gauche -->
                <path d="M20,10 Q10,0 15,40 L20,10 Z" fill="white" stroke="black" stroke-width="0.5"/>
                <!-- Oreille droite -->
                <path d="M40,10 Q30,0 35,40 L40,10 Z" fill="white" stroke="black" stroke-width="0.5"/>
                <!-- Tête -->
                <circle cx="30" cy="40" r="18" fill="white" stroke="black" stroke-width="0.5"/>
                <!-- Yeux -->
                <circle cx="25" cy="35" r="3" fill="black"/>
                <circle cx="35" cy="35" r="3" fill="black"/>
                <!-- Nez -->
                <path d="M30,45 L27,40 L33,40 Z" fill="pink"/>
                <!-- Moustaches -->
                <line x1="30" y1="42" x2="50" y2="38" stroke="black" stroke-width="1"/>
                <line x1="30" y1="42" x2="50" y2="42" stroke="black" stroke-width="1"/>
                <line x1="30" y1="42" x2="50" y2="46" stroke="black" stroke-width="1"/>
                <line x1="30" y1="42" x2="10" y2="38" stroke="black" stroke-width="1"/>
                <line x1="30" y1="42" x2="10" y2="42" stroke="black" stroke-width="1"/>
                <line x1="30" y1="42" x2="10" y2="46" stroke="black" stroke-width="1"/>
                <!-- Corps -->
                <ellipse cx="60" cy="60" rx="20" ry="12" fill="white" stroke="black" stroke-width="0.5"/>
                <!-- Queue -->
                <circle cx="75" cy="55" r="5" fill="white" stroke="black" stroke-width="0.5"/>
                <!-- Pattes -->
                <rect x="45" y="65" width="4" height="8" fill="white" stroke="black" stroke-width="0.5"/>
                <rect x="55" y="65" width="4" height="8" fill="white" stroke="black" stroke-width="0.5"/>
            </svg>
        </div>
    </div>

    <!-- Éléments audio -->
    <audio id="blueSound" src="./assets/music/sound1.mp3" preload="auto"></audio>
    <audio id="redSound" src="./assets/music/sound2.mp3" preload="auto"></audio>

    <!-- Script externe -->
    <script src="./horloge_1.js"></script>
</body>
</html>
